name: Fetch generated images (einmalig)

# Temporärer Hilfs-Workflow: lädt die neu generierten Higgsfield-Bilder,
# optimiert sie für das Web und committet sie. Wird danach wieder entfernt.

on: workflow_dispatch

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download & optimize
        run: |
          set -e
          command -v convert >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }
          BASE="https://d8j0ntlcm91z4.cloudfront.net/user_3FuPVC4JIayU3rXUwYAnv5ZoEBp"
          declare -A MAP=(
            [about-2]="hf_20260726_114914_b11eb9fd-7e08-4207-97e3-508a8a90ddcd.png"
            [about-3]="hf_20260726_114918_54185363-0d72-4d45-8eee-504a408f606d.png"
            [about-4]="hf_20260726_114921_8af681c7-bc79-4538-bf8b-239e0c1875b6.png"
          )
          mkdir -p /tmp/dl
          for n in "${!MAP[@]}"; do
            curl -sf --retry 3 -o "/tmp/dl/$n.png" "$BASE/${MAP[$n]}"
            echo "geladen: $n"
          done
          for n in "${!MAP[@]}"; do
            convert "/tmp/dl/$n.png" -resize "1000x>" -strip -interlace Plane -quality 82 "images/$n.jpg"
          done
          ls -la images/about-*.jpg

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/about-*.jpg
          git commit -m "Add AI-generated images for the about slideshow"
          git push
