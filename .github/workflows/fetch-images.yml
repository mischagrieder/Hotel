name: Fetch generated images (einmalig)

# Temporärer Hilfs-Workflow: lädt die neu generierten Higgsfield-Bilder,
# optimiert sie für das Web und committet sie. Wird danach wieder entfernt.

on: workflow_dispatch

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download & optimize
        run: |
          set -e
          command -v convert >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }
          BASE="https://d8j0ntlcm91z4.cloudfront.net/user_3FuPVC4JIayU3rXUwYAnv5ZoEBp"
          declare -A MAP=(
            [room-1b]="hf_20260726_101002_394d88df-2b27-481e-97a3-32ae6dd893fe.png"
            [room-2b]="hf_20260726_101004_34e7194a-76a4-49dc-b3ce-bbabe4296faa.png"
            [room-3b]="hf_20260726_101008_da1e5ee9-d8f1-44ab-aff3-16458a339892.png"
            [lobby]="hf_20260726_101011_ba651a99-9fac-4e83-b8fc-35572032f1ed.png"
            [restaurant]="hf_20260726_101014_1429bb2e-e09b-4147-8699-c5792c94b9d3.png"
          )
          mkdir -p /tmp/dl
          for n in "${!MAP[@]}"; do
            curl -sf --retry 3 -o "/tmp/dl/$n.png" "$BASE/${MAP[$n]}"
            echo "geladen: $n"
          done
          declare -A W=( [room-1b]=1000 [room-2b]=1000 [room-3b]=1000 [lobby]=900 [restaurant]=900 )
          for n in "${!W[@]}"; do
            convert "/tmp/dl/$n.png" -resize "${W[$n]}x>" -strip -interlace Plane -quality 82 "images/$n.jpg"
          done
          ls -la images/*.jpg

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/*.jpg
          git commit -m "Add additional AI-generated demo images (rooms detail, lobby, restaurant)"
          git push
