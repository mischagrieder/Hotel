name: Fetch generated images (einmalig)

# Temporärer Hilfs-Workflow: lädt die neu generierten Higgsfield-Bilder,
# optimiert sie für das Web und committet sie. Wird danach wieder entfernt.

on: workflow_dispatch

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download & optimize
        run: |
          set -e
          command -v convert >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }
          BASE="https://d8j0ntlcm91z4.cloudfront.net/user_3FuPVC4JIayU3rXUwYAnv5ZoEBp"
          declare -A MAP=(
            [near-1]="hf_20260726_110834_129cc16c-3e49-40e4-b9f9-21fda80dd03d.png"
            [near-2]="hf_20260726_110837_799bbd78-49de-4d4a-b038-abad78546697.png"
            [near-3]="hf_20260726_110839_e7955b80-6c1e-4d97-b49e-20e8e0f5cf36.png"
          )
          mkdir -p /tmp/dl
          for n in "${!MAP[@]}"; do
            curl -sf --retry 3 -o "/tmp/dl/$n.png" "$BASE/${MAP[$n]}"
            echo "geladen: $n"
          done
          for n in "${!MAP[@]}"; do
            convert "/tmp/dl/$n.png" -resize "800x>" -strip -interlace Plane -quality 82 "images/$n.jpg"
          done
          ls -la images/near-*.jpg

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/near-*.jpg
          git commit -m "Add AI-generated images for the nearby section"
          git push
