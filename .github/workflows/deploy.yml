name: Deploy to GitHub Pages

# Baut die statische Seite und veröffentlicht sie auf GitHub Pages.
# WICHTIG (einmalig): Repo → Settings → Pages → "Build and deployment" →
# Source auf "GitHub Actions" stellen. Danach läuft alles automatisch.

on:
  push:
    branches:
      - main
      - claude/hotel-website-template-i4xma5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
